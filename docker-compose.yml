services:
  #frontend:
  #  build:
  #    context: ./client
  #    target: runner
  #  ports:
  #    - "5173:5173"
  nginx:
    build:
      context: .
      dockerfile: .nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      target: runner
    expose:
      - "3000"
    env_file:
      - ./server/.env.docker
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    expose:
      - "5432"
    environment:
      POSTGRES_DB: devops_playground
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: ./server
      target: migration
    command: npm run db:migrate
    env_file:
      - ./server/.env.docker
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data:
