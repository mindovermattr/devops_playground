services:
  frontend:
    build:
      context: ./client
      target: runner
    ports:
      - "5173:5173"

  backend:
    build:
      context: ./server
      target: runner
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env.docker
    depends_on:
      - db

  db:
    image: postgres:17
    expose:
      - "5432"
    environment:
      POSTGRES_DB: devops_playground
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
